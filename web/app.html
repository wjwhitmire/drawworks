<title>Drawworks</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@400..800&family=Fira+Sans:wght@400;500;600;700&family=Fira+Mono:wght@400;500&display=swap">
<style>
/* Pen Plot and Doghouse. Layout: console title bar with menus, toolbar, view tabs, table beside Gantt, details pane, status bar. */
:root{--bg:#e9edef;--surface:#ffffff;--surface-2:#f1f4f5;--hair:#d6dde0;--line:#6c787e;--fg:#0f191e;--muted:#4a575e;--accent:#2343b8;--accent-ink:#ffffff;--mark:#8f0e62;--good:#1a6b3e;--warn:#985700;--bad:#a01b2b;--field:#ffffff;--chart-1:#2343b8;--chart-2:#8f0e62;--chart-3:#8a949a;--chart-4:#a85d00;--chart-grid:#e2e7ea;--title-bg:#14232b;--title-fg:#eef3f5;--title-muted:#a9bac2;--title-sel:#24404d;--band-1:#dde4e8;--band-2:#e9eef0;--band-3:#f2f5f6;--sel:#e8edfb;--row-hover:#f5f7f8;--crit-row:#fdf3f2;--nonwork:#f0f2f3;--bar-crit:#b5170f;--bar-near:#a37500;--bar-near-tint:#fbf0d9;--bar-norm:#2a778a;--bar-norm-tint:#cfe5ea;--bar-done:#1b252b;--bar-base:#7c878d;--bar-float:#3d4a51;--bar-sum:#0f191e;--bar-ink:#ffffff;--dd:#2343b8;--link:#6c787e;--link-drv:#b5170f;--tint-accent:#e6ebfa;--tint-mark:#f8e6f1;--tint-good:#e3f2e9;--tint-warn:#fbefdc;--tint-bad:#fbe8e6;--paper:#ffffff;--paper-ink:#0f191e;--paper-muted:#4a575e;--paper-rule:#0f191e;--paper-mark:#8f0e62;--e-1:0 1px 2px rgba(15,25,30,.06);--e-2:0 4px 12px rgba(15,25,30,.10),0 18px 40px rgba(15,25,30,.14);--e-paper:0 1px 3px rgba(15,25,30,.12),0 12px 32px rgba(15,25,30,.10);--scrim:rgba(15,25,30,.42);color-scheme:light;
--display:"Sofia Sans Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",sans-serif;
--body:"Fira Sans","Segoe UI","Helvetica Neue",Arial,"DejaVu Sans",system-ui,sans-serif;
--mono:"Fira Mono",ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
--t-xs:.8125rem;--t-sm:.875rem;--t-md:1rem;--t-lg:1.125rem;--t-xl:1.375rem;--t-2xl:1.875rem;--t-key:1.75rem;
--s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--s-10:40px;--s-12:48px;
--r-xs:3px;--r-sm:4px;--r-md:6px;--r-lg:8px;
--m-fast:120ms;--m-base:180ms;--ease:cubic-bezier(.2,.8,.2,1);
--tap:44px;--rh:32px;--tfs:1rem;--head-h:62px;--top-h:56px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1114;--surface:#151b1f;--surface-2:#1c2328;--hair:#2a3339;--line:#76848c;--fg:#e8eef1;--muted:#a6b3ba;--accent:#9db0ff;--accent-ink:#0c1433;--mark:#ff9ad6;--good:#6fd49b;--warn:#f0b35a;--bad:#ff8b7d;--field:#11161a;--chart-1:#9db0ff;--chart-2:#ff9ad6;--chart-3:#7d8a92;--chart-4:#f0a64a;--chart-grid:#242c32;--title-bg:#080b0d;--title-fg:#e8eef1;--title-muted:#9aa8b0;--title-sel:#1d2a33;--band-1:#222b31;--band-2:#1b2227;--band-3:#171d21;--sel:#1f2a4a;--row-hover:#192024;--crit-row:#21191a;--nonwork:#171e22;--bar-crit:#ff6b5c;--bar-near:#f0b04a;--bar-near-tint:#3a2d14;--bar-norm:#3f97a9;--bar-norm-tint:#14363e;--bar-done:#f1f4f6;--bar-base:#6b7880;--bar-float:#b7c3c9;--bar-sum:#e8eef1;--bar-ink:#0d1114;--dd:#9db0ff;--link:#76848c;--link-drv:#ff6b5c;--tint-accent:#1f2a4a;--tint-mark:#3a1830;--tint-good:#15301f;--tint-warn:#33270f;--tint-bad:#3a1b18;--paper:#ffffff;--paper-ink:#0f191e;--paper-muted:#4a575e;--paper-rule:#0f191e;--paper-mark:#8f0e62;--e-1:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.45);--e-2:0 6px 16px rgba(0,0,0,.5),0 24px 48px rgba(0,0,0,.5);--e-paper:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.45);--scrim:rgba(4,6,8,.66);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1114;--surface:#151b1f;--surface-2:#1c2328;--hair:#2a3339;--line:#76848c;--fg:#e8eef1;--muted:#a6b3ba;--accent:#9db0ff;--accent-ink:#0c1433;--mark:#ff9ad6;--good:#6fd49b;--warn:#f0b35a;--bad:#ff8b7d;--field:#11161a;--chart-1:#9db0ff;--chart-2:#ff9ad6;--chart-3:#7d8a92;--chart-4:#f0a64a;--chart-grid:#242c32;--title-bg:#080b0d;--title-fg:#e8eef1;--title-muted:#9aa8b0;--title-sel:#1d2a33;--band-1:#222b31;--band-2:#1b2227;--band-3:#171d21;--sel:#1f2a4a;--row-hover:#192024;--crit-row:#21191a;--nonwork:#171e22;--bar-crit:#ff6b5c;--bar-near:#f0b04a;--bar-near-tint:#3a2d14;--bar-norm:#3f97a9;--bar-norm-tint:#14363e;--bar-done:#f1f4f6;--bar-base:#6b7880;--bar-float:#b7c3c9;--bar-sum:#e8eef1;--bar-ink:#0d1114;--dd:#9db0ff;--link:#76848c;--link-drv:#ff6b5c;--tint-accent:#1f2a4a;--tint-mark:#3a1830;--tint-good:#15301f;--tint-warn:#33270f;--tint-bad:#3a1b18;--paper:#ffffff;--paper-ink:#0f191e;--paper-muted:#4a575e;--paper-rule:#0f191e;--paper-mark:#8f0e62;--e-1:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.45);--e-2:0 6px 16px rgba(0,0,0,.5),0 24px 48px rgba(0,0,0,.5);--e-paper:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.45);--scrim:rgba(4,6,8,.66);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--t-md)/1.5 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
[hidden]{display:none!important}
.i{width:20px;height:20px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:.9375em}
.n,.d,.tnum{font-variant-numeric:tabular-nums lining-nums}
.n{text-align:right}

/* ---------- app chrome ---------- */
.app{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--e-1);min-width:0;display:flex;flex-direction:column;position:relative}
.top{background:var(--title-bg);color:var(--title-fg);display:flex;align-items:center;gap:12px;min-height:var(--top-h);padding-inline:12px 8px}
.top :focus-visible{outline-color:var(--title-fg)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.brand .mark{width:32px;height:32px;flex:none}
.brand .name{font:750 1.5rem/1 var(--display);letter-spacing:.005em;white-space:nowrap}
.top .proj{font:500 var(--t-md)/1.2 var(--body);color:var(--title-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ex-chip{font:600 var(--t-xs)/1 var(--body);letter-spacing:.04em;text-transform:uppercase;border:1.5px dashed var(--title-muted);color:var(--title-fg);border-radius:var(--r-sm);padding:5px 8px;white-space:nowrap}
.menubar{display:flex;gap:2px;margin-left:8px}
.mb{background:none;border:0;color:var(--title-fg);min-height:var(--tap);padding:0 12px;border-radius:var(--r-md);cursor:pointer;font-weight:500}
.mb:hover,.mb[aria-expanded="true"]{background:var(--title-sel)}
.top .iconbtn{color:var(--title-fg)}
.top .iconbtn:hover{background:var(--title-sel)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);border:0;background:none;border-radius:var(--r-md);cursor:pointer;color:var(--fg);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.only-phone,.toolbar .only-phone{display:none}

.toolbar{container-type:inline-size;display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid var(--hair);background:var(--surface);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
.tb{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 10px;border:1px solid transparent;border-radius:var(--r-md);background:none;cursor:pointer;white-space:nowrap;font-weight:500;flex:none}
.tb:hover{background:var(--surface-2);border-color:var(--hair)}
.tb.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tb.primary:hover{filter:brightness(1.08)}
.tb[disabled]{color:var(--muted);cursor:default;background:none;border-color:transparent;opacity:.7}
.tb.icon{padding:0;width:var(--tap);justify-content:center}
.tb kbd{font:500 var(--t-xs)/1 var(--mono);opacity:.85;border:1px solid currentColor;border-radius:3px;padding:2px 4px}
.sep{width:1px;height:28px;background:var(--hair);margin:0 6px;flex:none}
.tbl-lab{font-size:var(--t-sm);color:var(--muted);margin:0 4px 0 6px;white-space:nowrap}
.tsel,.inp,select,input[type=text],input[type=search],input[type=datetime-local]{min-height:var(--tap);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--field);padding:0 10px;font-size:var(--t-md);color:var(--fg);max-width:100%}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.tsel{width:190px;flex:none}
.searchbox .tsearch{width:200px;flex:none;padding-left:36px;background-image:none}
.searchbox{position:relative;flex:none;display:flex;align-items:center}
.searchbox .i{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.zoom{min-width:112px;text-align:center;font:600 var(--t-sm)/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@container (max-width:1300px){.sep.wide{margin:0 2px}.tsel{width:140px!important}.searchbox .tsearch{width:170px!important}.zoom{min-width:60px!important;font-size:var(--t-xs)}}
@container (max-width:1500px){.tb.sec span,.tb.sec kbd{display:none}.tb.sec{padding:0;width:var(--tap);justify-content:center}.tsel{width:168px}.searchbox .tsearch{width:160px}.zoom{min-width:84px}.tbl-lab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}

.tabs{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line);background:var(--surface);padding-inline:8px;min-height:56px}
.tab{background:none;border:0;border-bottom:3px solid transparent;min-height:48px;padding:0 14px;cursor:pointer;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tab .i{width:18px;height:18px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}
.badge{font:600 var(--t-xs)/1 var(--body);background:var(--tint-warn);color:var(--warn);border-radius:999px;padding:3px 7px;font-variant-numeric:tabular-nums}
.tabs-fill{flex:1}
.pane-switch{display:none;gap:0;align-self:center;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.ps{border:0;background:var(--field);min-height:var(--tap);padding:0 14px;cursor:pointer;font-weight:500}
.ps+.ps{border-left:1px solid var(--line)}
.ps[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* key answer: the finish flag */
.key{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;align-self:center;padding:4px 8px 4px 4px}
.key-ico{grid-row:1/3;width:26px;height:26px}
.key-ico path{fill:var(--mark)}
.key-l{font:600 var(--t-xs)/1.1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mark)}
.key-v{font:750 var(--t-key)/1 var(--display);font-variant-numeric:tabular-nums lining-nums;color:var(--mark);white-space:nowrap}
.key-v small{font:600 var(--t-md)/1 var(--display);margin-left:8px;color:var(--fg);letter-spacing:.02em}
.key-s{grid-column:1/3;font-size:var(--t-sm);color:var(--muted);text-align:right}
.key.in-card{padding:0;justify-self:start;align-self:flex-start}
.ph-only{display:none}
.key.in-card .key-s{text-align:left;grid-column:2}

/* sheet: table beside Gantt */
.sheet{display:flex;min-height:0;border-bottom:1px solid var(--line);background:var(--surface)}
.pane{display:flex;flex-direction:column;min-width:0;position:relative}
.tpane{width:min(var(--tw,680px),59%);flex:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.gpane{flex:1;overflow:hidden}
.gscroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.gscroll svg{display:block}
.split{width:9px;flex:none;cursor:col-resize;background:var(--surface-2);border-inline:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.split::after{content:"";width:3px;height:28px;border-inline:1px solid currentColor;opacity:.6}
.thead{display:flex;height:var(--head-h);background:var(--surface-2);border-bottom:1px solid var(--line);flex:none}
.hc{flex:none;display:flex;align-items:flex-end;padding:0 8px 7px;font:600 var(--t-xs)/1.15 var(--body);color:var(--muted);border-right:1px solid var(--hair);white-space:normal}
.hc.n{justify-content:flex-end;text-align:right}
.hc.pc,.tc.pc{width:28px;padding:0;justify-content:center}
.rows{display:flex;flex-direction:column}
.tr{display:flex;height:var(--rh);border-bottom:1px solid var(--hair);font-size:var(--tfs);background:var(--surface);flex:none}
.tr:hover{background:var(--row-hover)}
.tc{flex:none;padding:0 8px;line-height:calc(var(--rh) - 1px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--hair)}
.tc.n{text-align:right;font-variant-numeric:tabular-nums lining-nums}
.tc.d{font-variant-numeric:tabular-nums lining-nums}
.tc.pc{display:grid;place-items:center}
.pen{width:20px;height:12px;display:block}
.c-code{font-family:var(--mono);font-size:.9375em}
.tr.crit .c-code{color:var(--bar-crit);font-weight:500}
.tr.done{color:var(--muted)}
.tr.neg,.tc.neg{color:var(--bad);font-weight:600}
.act-a{display:inline-block;margin-left:4px;font:600 var(--t-xs)/1 var(--body);color:var(--muted)}
.tr.sel,.tr.sel:hover{background:var(--sel)}
.tr.sel .pc{box-shadow:inset 3px 0 0 var(--accent)}
.tr.grp{font-weight:600}
.tr.grp.l1{background:var(--band-1)}.tr.grp.l2{background:var(--band-2)}.tr.grp.l3{background:var(--band-3)}
.tr.grp .tc{border-right-color:transparent}
.tr.grp .wcell{display:flex;align-items:center;gap:6px}
.wcell .wname{overflow:hidden;text-overflow:ellipsis}
.wcode{font:500 var(--t-sm)/1 var(--mono);color:var(--muted);flex:none}
.wname{font:650 1.0625rem/calc(var(--rh) - 1px) var(--display);letter-spacing:.01em}
.tr.grp .tc.d,.tr.grp .tc.n{font-weight:500}
.tw{width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;color:var(--fg);flex:none;padding:0}
.tw .i{width:18px;height:18px}
.tw:hover{background:var(--surface)}
.ed{cursor:text}

/* Gantt marks: every state has its own pen pattern, color is the second cue */
.g-headbg{fill:var(--surface-2)}
.g-tick{stroke:var(--hair);stroke-width:1}
.g-label{fill:var(--muted);font:600 13px var(--display);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.g-field{fill:var(--field)}
.g-nonwork{fill:var(--nonwork)}
.g-grid{stroke:var(--chart-grid);stroke-width:1}
.g-band.l1{fill:var(--band-1)}.g-band.l2{fill:var(--band-2)}.g-band.l3{fill:var(--band-3)}
.g-row.sel{fill:var(--sel)}
.g-bar{fill:var(--bar-norm-tint);stroke:var(--bar-norm);stroke-width:1.5}
.g-bar.crit{fill:var(--bar-crit);stroke:none}
.g-bar.near{stroke:var(--bar-near);stroke-width:1.5}
.g-bar.done,.g-act{fill:var(--bar-done);stroke:none}
.g-ms{fill:var(--field);stroke:var(--bar-norm);stroke-width:2}
.g-ms.crit{fill:var(--bar-crit);stroke:none}.g-ms.done{fill:var(--bar-done);stroke:none}.g-ms.near{stroke:var(--bar-near)}
.g-bl{fill:var(--bar-base)}
.g-float{fill:none;stroke:var(--bar-float);stroke-width:1.5}
.g-sum{fill:var(--bar-sum)}
.g-link{fill:none;stroke:var(--link);stroke-width:1}
.g-link.drv{stroke:var(--link-drv);stroke-width:1.75}
.g-arrow{fill:var(--link)}.g-arrow.drv{fill:var(--link-drv)}
.g-dd{stroke:var(--dd);stroke-width:2;stroke-dasharray:6 4}
.g-fin{stroke:var(--mark);stroke-width:2}
.g-text{fill:var(--fg);font:400 13px var(--body)}
.pf-near{fill:var(--bar-near-tint)}.ps-near{stroke:var(--bar-near);stroke-width:2}
.pf-over{fill:var(--tint-bad)}.ps-over{stroke:var(--bad);stroke-width:2.5}
.g-flag-dd rect{fill:var(--dd)}.g-flag-dd .g-flag-tx{fill:var(--accent-ink)}.g-flag-dd .g-flag-ico{stroke:var(--accent-ink);stroke-width:2;fill:none}
.g-flag-fin rect{fill:var(--tint-mark);stroke:var(--mark);stroke-width:1.25}.g-flag-fin .g-flag-tx{fill:var(--mark)}.g-flag-fin .g-flag-ico{fill:var(--mark)}
.g-flag-tx{font:700 12px var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
[data-density="dense"]{--rh:24px;--tfs:.875rem}
[data-density="dense"] .g-text{font-size:12px}
[data-density="dense"] .tw{width:22px;height:22px}
[data-density="comfortable"]{--rh:44px}
@media (pointer:coarse){.app,.dens-touch{--rh:44px;--tfs:1rem}.tw{width:44px;height:44px}}

/* details pane */
.details{background:var(--surface);border-bottom:1px solid var(--line)}
.dtabs{display:flex;align-items:stretch;border-bottom:1px solid var(--hair);padding-inline:8px;overflow-x:auto;scrollbar-width:thin}
.dtab{background:none;border:0;border-bottom:3px solid transparent;min-height:48px;padding:0 14px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.dtab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 16px 0;flex-wrap:wrap}
.dhead .c-code{font-weight:500}
.dhead strong{font:700 var(--t-xl)/1.15 var(--display)}
.dbody{padding:12px 16px 16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.dbody.split2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px;align-content:start}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld .lab{font-size:var(--t-sm);font-weight:500;color:var(--muted)}
.fld .inp,.fld select,.fld input{width:100%}
input[disabled],select[disabled]{background:var(--surface-2);color:var(--muted)}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:0;margin:0;border-top:1px solid var(--hair);align-content:start}
.facts dt,.facts dd{margin:0;padding:9px 0;border-bottom:1px solid var(--hair)}
.facts dt{color:var(--muted);font-size:var(--t-sm);padding-right:16px;align-self:center}
.facts dd{font-variant-numeric:tabular-nums lining-nums;text-align:right}
.facts dd.crit{color:var(--bar-crit);font-weight:600}

/* status bar and footer */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:0;background:var(--surface-2);font-size:var(--t-sm);color:var(--muted);font-variant-numeric:tabular-nums lining-nums;padding-inline:4px}
.status>span{display:inline-flex;align-items:center;gap:6px;padding:0 12px;min-height:44px;border-right:1px solid var(--hair);white-space:nowrap}

<script id="core">
"use strict";
// ---- core/00_brand.js
// The product name lives here and in src/fieldsched/brand.py, nowhere else in the code.
const PRODUCT_NAME = "Drawworks";

// ---- core/01_time.js
// ---------------------------------------------------------------- errors, dates, work calendars
// Mirrors src/fieldsched/errors.py and timecal.py exactly: integer minutes since 1970-01-01 00:00 on
// a wall clock, integer working minutes for durations, calendars with a Sunday-first work week.
class SchedError extends Error {
  constructor(code, message) { super(message); this.code = code; this.message = message; }
}
const DAY = 1440;
const MAX_SCAN_DAYS = 366 * 60;
const fdiv = (a, b) => Math.floor(a / b);
const mod = (a, b) => ((a % b) + b) % b;
const pad = (n, w) => String(n).padStart(w, "0");

function days_from_civil(y, m, d) {
  y -= m <= 2 ? 1 : 0;
  const era = fdiv(y >= 0 ? y : y - 399, 400);
  const yoe = y - era * 400;
  const doy = fdiv(153 * (m + (m > 2 ? -3 : 9)) + 2, 5) + d - 1;
  const doe = yoe * 365 + fdiv(yoe, 4) - fdiv(yoe, 100) + doy;
  return era * 146097 + doe - 719468;
}
function civil_from_days(z) {
  z += 719468;
  const era = fdiv(z >= 0 ? z : z - 146096, 146097);
  const doe = z - era * 146097;
  const yoe = fdiv(doe - fdiv(doe, 1460) + fdiv(doe, 36524) - fdiv(doe, 146096), 365);
  const y = yoe + era * 400;
  const doy = doe - (365 * yoe + fdiv(yoe, 4) - fdiv(yoe, 100));
  const mp = fdiv(5 * doy + 2, 153);
  const d = doy - fdiv(153 * mp + 2, 5) + 1;
  const m = mp + (mp < 10 ? 3 : -9);
  return [y + (m <= 2 ? 1 : 0), m, d];
}
const weekday = (day) => mod(day + 4, 7);
const DT_RE = /^\s*(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?)?\s*$/;
function valid_ymd(y, m, d) {
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31 && y >= 1900 && y <= 2200)) return false;
  const c = civil_from_days(days_from_civil(y, m, d));
  return c[0] === y && c[1] === m && c[2] === d;
}
// parsed and formatted dates repeat constantly in a schedule, so both directions are cached
const _PD = new Map(), _FD = new Map();
function parse_dt(s, field) {
  if (typeof s === "string") { const hit = _PD.get(s); if (hit !== undefined) return hit; }
  const v = _parse_dt(s, field);
  if (_PD.size > 200000) _PD.clear();
  _PD.set(s, v);
  return v;
}
function _parse_dt(s, field) {
  field = field || "date";

function topo_order(acts, rels) {

  const inn = new Map(ids.map((i) => [i, []]));

    indeg.set(r.succ, indeg.get(r.succ) + 1);
    out.get(r.pred).push(r.succ);
    inn.get(r.succ).push(r.pred);
  }
  const queue = ids.filter((i) => indeg.get(i) === 0);

  for (let k = 0; k < queue.length; k++) {

    order.push(n);

      if (indeg.get(s) === 0) queue.push(s);
    }

  if (order.length < ids.length) {
    const left = new Set(ids.filter((i) => indeg.get(i) > 0));
    const code = new Map(acts.map((a) => [a.id, a.code]));
    const start = ids.find((i) => left.has(i));
    const path = [], seen = new Map();
    let cur = start;
    while (!seen.has(cur)) {
      seen.set(cur, path.length);
      path.push(cur);
      cur = inn.get(cur).find((p) => left.has(p));
    }
    const back = path.slice(seen.get(cur));
    const cyc = [back[0]].concat(back.slice(1).reverse(), [back[0]]);
    const err = new SchedError("loop", "Logic loop: " + cyc.map((c) => code.get(c)).join(" -> ") + ". Remove or reverse one of these relationships.");

function propose_update(p, sched, newDd) {
  const nd = parse_dt(newDd, "new data date");
  if (nd < parse_dt(p.data_date)) throw new SchedError("bad_date", "The new data date is before the current data date.");
  const ctx = new Ctx(p);
  const out = [];
  for (const a of p.activities) {
    const st = status_of(a);
    if (st === "complete") continue;
    const rec = sched.acts[a.id], C = ctx.cal.get(a.id);
    const es = parse_dt(rec.es), ef = parse_dt(rec.ef), res = parse_dt(rec.res);
    const prop = { act: a.id, code: a.code, as: a.as, af: null, rd: a.rd };
    let why;
    if (st === "planned") {
      if (es >= nd) continue;
      prop.as = rec.es;
      why = `Planned to start ${rec.es.replace("T", " ")}, before the new data date`;
    } else {
      if (res >= nd) continue;
      why = `In progress; planned work continues from ${rec.res.replace("T", " ")}`;
    }
    if (ef <= nd) {
      prop.af = rec.ef;
      prop.rd = 0;
      why += `; planned to finish ${rec.ef.replace("T", " ")}, so it is proposed complete.`;
    } else {
      prop.rd = C.work_between(nd, ef);
      why += "; remaining duration is the planned work after the new data date.";
    }
    if (a.pct_type === "physical") {
      const od = a.od;
      const done = prop.af ? 100 : od ? Math.floor((od - prop.rd) * 100 / od + 0.5) : 0;
      prop.phys = Math.max(0, Math.min(100, done));
    }
    prop.why = why;
    out.push(prop);
  }
  return out;
}

function apply_update(p, props, newDd) {
  const q = Object.assign({}, p, { data_date: fmt_dt(parse_dt(newDd, "new data date")) });
  const acts = new Map(p.activities.map((a) => [a.id, Object.assign({}, a)]));
  for (const pr of props) {
    const a = acts.get(get(pr, "act"));
    if (a === undefined) throw new SchedError("bad_ref", "A proposal points to an activity that does not exist.");

    if (truthy(get(pr, "af"))) a.af = pr.af;
    if (has(pr, "rd") && pr.rd !== null) a.rd = pr.rd;
    if (has(pr, "phys")) a.phys = pr.phys;
  }
  q.activities = p.activities.map((a) => acts.get(a.id));
  return validate_project(q);
}

function take_baseline(p, sched, bid, name, taken) {
  const rows = {};

    const rec = sched.acts[a.id];
    rows[a.id] = [a.as || rec.es, a.af || rec.ef, a.od];

  if (bls.length >= 20) throw new SchedError("too_many", "A project keeps at most 20 baselines. Delete one first.");
  bls.push({ id: bid, name, taken: taken || p.data_date, acts: rows });

  const bl = p.baselines.find((b) => b.id === bid);

  const dd = parse_dt(p.data_date);
  const out = {};
  for (const a of p.activities) {

    out[a.id] = { bs: row[0], bf: row[1], bd: row[2], sv: C.work_between(cs, bs), fv: C.work_between(cf, bf), dv: row[2] - atc };

function histogram(p, sched, rsrcId, which = "early", bucket = "day") {
  const ctx = new Ctx(p);
  const r = p.resources.find((x) => x.id === rsrcId);
  if (!r) throw new SchedError("bad_ref", "That resource does not exist.");
  const dd = parse_dt(p.data_date);
  const act = new Map(), rem = new Map(), spans = [];
  for (const x of p.assigns) {
    if (x.rsrc !== rsrcId) continue;
    const a = ctx.acts.get(x.act), C = ctx.cal.get(a.id), rec = sched.acts[a.id], st = status_of(a);
    if (st !== "planned" && x.actual) {
      const end = a.af ? parse_dt(a.af) : Math.max(dd, parse_dt(a.as));
      const sp = _spread(C, parse_dt(a.as), end);
      const tot = sp.reduce((t, [, w]) => t + w, 0);
      for (const [d, w] of sp) act.set(d, (act.get(d) || 0) + round_div(x.actual * w, tot));
    }
    if (st !== "complete" && a.rd > 0) {
      let s, b;
      if (which === "late") { b = parse_dt(rec.lf); s = C.sub_work(b, a.rd); } else { s = parse_dt(rec.res); b = parse_dt(rec.ef); }
      for (const [d, w] of _spread(C, s, b)) rem.set(d, (rem.get(d) || 0) + x.units * w);
      if (b > s) spans.push([s, b, x.units]);

  const units = day_peaks(spans);

  if (days.length) {
    const pc = ctx.pcal;
    for (let d = days[0]; d <= days[days.length - 1]; d++)
      rows.push({ d, actual: act.get(d) || 0, remaining: round_div(rem.get(d) || 0, 60), units: units.get(d) || 0, limit: round_div(r.max_units * pc.day_work(d), 60) });
  }
  if (bucket === "week") {
    const weeks = new Map();
    for (const row of rows) {
      const k = row.d - mod(row.d + 3, 7);
      if (!weeks.has(k)) weeks.set(k, { d: k, actual: 0, remaining: 0, units: 0, limit: 0 });

// a small binary heap ordered by cmpTuple, standing in for Python's heapq
class Heap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(v) {
    const a = this.a; a.push(v);
    let i = a.length - 1;
    while (i > 0) { const j = (i - 1) >> 1; if (cmpTuple(a[i], a[j]) >= 0) break; [a[i], a[j]] = [a[j], a[i]]; i = j; }
  }
  pop() {
    const a = this.a, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1;
        let m = i;
        if (l < a.length && cmpTuple(a[l], a[m]) < 0) m = l;
        if (r < a.length && cmpTuple(a[r], a[m]) < 0) m = r;
        if (m === i) break;
        [a[i], a[m]] = [a[m], a[i]]; i = m;
      }
    }
    return top;
  }
}

function leveling_suggestions(p, sched) {
  const ctx = new Ctx(p);
  const rmax = new Map(p.resources.map((r) => [r.id, r.max_units]));
  const byAct = new Map();
  for (const x of p.assigns) if (x.units > 0 && (rmax.get(x.rsrc) || 0) > 0) { if (!byAct.has(x.act)) byAct.set(x.act, []); byAct.get(x.act).push(x); }
  const use = new Map();
  const base = Math.max(parse_dt(p.start), parse_dt(p.data_date));
  const E = new Map();
  const indeg = new Map(p.activities.map((a) => [a.id, 0]));
  for (const r of p.rels) indeg.set(r.succ, indeg.get(r.succ) + 1);
  const acts = sched.acts;
  const key = (aid) => [acts[aid].es, acts[aid].tf !== null ? acts[aid].tf : -(10 ** 12), ctx.acts.get(aid).code, aid];
  const ready = new Heap();
  for (const [i, n] of indeg) if (n === 0) ready.push(key(i));
  const out = [];
  while (ready.size) {
    const aid = ready.pop()[3];
    const a = ctx.acts.get(aid), C = ctx.cal.get(aid);
    let [es, ef, res] = forward_one(ctx, aid, E, base);
    const st = status_of(a);
    const xs = byAct.get(aid) || [];
    if (st === "planned" && xs.length && a.cstr !== "MS_MAND" && a.cstr !== "MF_MAND") {
      let tries = 0;
      while (es < ef) {
        // only other work can be waited out: an assignment over the maximum on its own is placed
        // where nothing else overlaps it
        const clash = xs.filter((x) => { const pk = peak_load(use.get(x.rsrc) || [], es, ef); return pk > 0 && pk + x.units > rmax.get(x.rsrc); });
        if (!clash.length || tries > 20000) break;
        tries++;
        const ends = [];
        for (const x of clash) for (const [s0, e] of use.get(x.rsrc) || []) if (s0 < ef && e > es) ends.push(e);
        const nxt = ends.length ? minOf(ends) : C.snap_fwd(es + 1);
        [es, ef, res] = forward_one(ctx, aid, E, base, Math.max(nxt, es + 1));
      }
      if (es > parse_dt(acts[aid].es)) {
        const old = parse_dt(acts[aid].es);
        const delay = C.work_between(old, es);
        const tf = acts[aid].tf;
        const rs = Array.from(new Set(xs.map((x) => x.rsrc))).sort(cmp);
        out.push({ act: aid, code: a.code, from: acts[aid].es, to: fmt_dt(es), delay, within_float: tf !== null && delay <= tf, rsrc: rs,
          why: "Over the maximum units of " + rs.join(", ") + " on its early dates." });
      }
    }
    if (st !== "complete" && xs.length) {
      const s = st === "active" ? res : es;
      if (ef > s) for (const x of xs) { if (!use.has(x.rsrc)) use.set(x.rsrc, []); use.get(x.rsrc).push([s, ef, x.units]); }
    }
    E.set(aid, [es, ef, res]);
    for (const r of ctx.succs.get(aid)) {
      indeg.set(r.succ, indeg.get(r.succ) - 1);
      if (indeg.get(r.succ) === 0) ready.push(key(r.succ));
    }
  }
  if (E.size < p.activities.length) throw new SchedError("loop", "The logic has a loop; schedule first to see where.");
  const fins = Array.from(E.values()).map((e) => e[1]);
  return { suggestions: out, finish: fins.length ? fmt_dt(maxOf(fins)) : null };
}

function apply_leveling(p, suggestions) {
  const want = new Map(suggestions.map((s) => [s.act, s.to]));
  const acts = p.activities.map((a) => (want.has(a.id) && (a.cstr === "ASAP" || a.cstr === "SNET") ? Object.assign({}, a, { cstr: "SNET", cstr_date: want.get(a.id) }) : a));
  return validate_project(Object.assign({}, p, { activities: acts }));

const CSTR_WORDS = { SNET: "start on or after", FNET: "finish on or after", MSO: "start on", MFO: "finish on", SNLT: "start on or before",

  for (const r of p.rels) { preds.get(r.succ).push(r.type); succs.get(r.pred).push(r.type); }

    else if (pr.length && !pr.some((t) => t === "FS" || t === "SS")) rows.push({ act: i, kind: "start_dangle" });

function check(p, sched) {

  APP.undo.push(e);
  let chars = APP.undo.reduce((t, u) => t + u.p.length, 0);
  while (APP.undo.length > UNDO_MAX || (chars > UNDO_CHARS && APP.undo.length > 1)) chars -= APP.undo.shift().p.length;
  APP.redo = [];

    !finBefore ? `Recalculated in ${APP.ms} ms; finish ${fmtDate(APP.s.finish)}.` :
    finBefore === APP.s.finish ? `Recalculated in ${APP.ms} ms; the finish did not move.` :
    `Recalculated in ${APP.ms} ms; the finish moved from ${fmtDate(finBefore)} to ${fmtDate(APP.s.finish)}.`;

// ---- ids and codes for new records
function nextId(rows, prefix) {
  const used = new Set(rows.map((r) => r.id));
  let n = rows.length + 1;
  while (used.has(prefix + n)) n++;
  return prefix + n;
}
// Activity IDs count up by 10 from the highest numbered code with the same prefix (A1000, A1010, ...).
function nextCode() {
  let best = null;
  for (const a of APP.p.activities) {
    const m = /^(.*?)(\d+)$/.exec(a.code);
    if (m && (!best || +m[2] > best.n)) best = { pre: m[1], n: +m[2], w: m[2].length };
  }
  if (!best) return "A1000";
  const used = new Set(APP.p.activities.map((a) => a.code));
  let n = best.n + 10;
  while (used.has(best.pre + String(n).padStart(best.w, "0"))) n += 10;
  return best.pre + String(n).padStart(best.w, "0");
}

// ---- display rows: WBS bands and activities, filtered, collapsed groups hidden
const FILTERS = [
  ["all", "All activities"], ["crit", "Critical activities"], ["near", "Critical and near critical"], ["open", "Not complete"],
  ["started", "In progress"], ["neg", "Negative float"], ["lp", "Longest path"],
];
function actPasses(a) {
  const rec = APP.s ? APP.s.acts[a.id] : null;
  const f = APP.filter;
  if (f === "crit" && !(rec && rec.crit)) return false;
  if (f === "near" && !(rec && (rec.crit || rec.near))) return false;
  if (f === "open" && a.af) return false;
  if (f === "started" && !(a.as && !a.af)) return false;
  if (f === "neg" && !(rec && rec.tf !== null && rec.tf < 0)) return false;
  if (f === "lp" && !(rec && rec.lp)) return false;
  if (f.startsWith("wbs:")) {
    const target = f.slice(4);
    let w = a.wbs, ok = false;
    const parent = new Map(APP.p.wbs.map((x) => [x.id, x.parent]));
    while (w) { if (w === target) { ok = true; break; } w = parent.get(w); }
    if (!ok) return false;
  }
  if (f.startsWith("rsrc:") && !APP.p.assigns.some((x) => x.act === a.id && x.rsrc === f.slice(5))) return false;
  if (APP.search) {
    const q = APP.search.toLowerCase();
    if (!a.code.toLowerCase().includes(q) && !a.name.toLowerCase().includes(q)) return false;
  }
  return true;
}
function buildRows() {
  const tree = C.tree_rows(APP.p);
  const visible = new Set(APP.p.activities.filter(actPasses).map((a) => a.id));
  const parent = new Map(APP.p.wbs.map((w) => [w.id, w.parent]));
  const live = new Set();
  for (const a of APP.p.activities) if (visible.has(a.id)) { let w = a.wbs; while (w) { live.add(w); w = parent.get(w); } }
  const rows = [];
  const hiddenUnder = (w) => { while (w) { if (APP.collapsed.has(w)) return true; w = parent.get(w); } return false; };
  for (const [kind, x, level] of tree) {
    if (kind === "w") {
      if (!live.has(x.id) || hiddenUnder(x.parent)) continue;
      rows.push({ kind, id: x.id, w: x, depth: level - 1 });
    } else {
      if (!visible.has(x.id) || hiddenUnder(x.wbs)) continue;
      rows.push({ kind, id: x.id, a: x, depth: level - 1 });
    }
  }
  APP.rows = rows;
  APP.rowIndex = new Map();
  rows.forEach((r, i) => { if (r.kind === "a") APP.rowIndex.set(r.id, i); });
}

// ---- timeline geometry
let TL = { t0: 0, t1: 1, ppd: 36 };
function timeline() {
  let lo = C.parse_dt(APP.p.data_date), hi = lo;
  const see = (s) => { if (s) { const t = C.parse_dt(s); if (t < lo) lo = t; if (t > hi) hi = t; } };
  see(APP.p.start);
  if (APP.s) { for (const a of APP.p.activities) { const r = APP.s.acts[a.id]; see(r.es); see(r.ef); see(r.lf); see(a.as); } see(APP.s.finish); }
  const b = APP.p.baselines.find((x) => x.id === APP.p.baseline);
  if (b && APP.baseline) for (const k of Object.keys(b.acts)) { see(b.acts[k][0]); see(b.acts[k][1]); }

  const t0 = (Math.floor(lo / 1440) - 3) * 1440, t1 = (Math.floor(hi / 1440) + 10) * 1440;
  while ((t1 - t0) / 1440 * ppd > 400000 && APP.zoom > 0) { APP.zoom--; ppd = ZOOMS[APP.zoom].ppd; }

  const vw = ($("gscroll") && $("gscroll").clientWidth) || 0;

}

function toggleGroup(id) {

// double-click a column edge to fit its content, as both desktop tools do; drag it to resize
function fitColumn(k) {

// ---- timescale: two tiers and the flag lane (data date, and the finish as the key answer)
function drawScale() {
  const s = clear($("gscale"));
  const W = tlWidth();
  s.setAttribute("width", W);
  s.setAttribute("height", HEAD_H);
  s.append(svg("rect", { width: W, height: HEAD_H, class: "g-headbg" }));
  const ppd = TL.ppd;
  const d0 = Math.floor(TL.t0 / 1440), d1 = Math.floor(TL.t1 / 1440);
  const tops = [], bots = [];
  let prevTop = null, prevBot = null;
  for (let d = d0; d <= d1; d++) {
    const [y, m, dd] = C.civil_from_days(d);
    const wd = C.weekday(d);
    const x = X(d * 1440);
    const p2 = String(dd).padStart(2, "0");
    let topKey, topLabel, botKey, botLabel;
    if (ppd < 3) { topKey = y; topLabel = String(y); botKey = y * 4 + Math.floor((m - 1) / 3); botLabel = "Q" + (Math.floor((m - 1) / 3) + 1); }
    else if (ppd < 10) { topKey = y; topLabel = String(y); botKey = y * 12 + m; botLabel = MON[m - 1]; }
    else if (ppd < 30) { topKey = y * 12 + m; topLabel = MON[m - 1] + " " + y; botKey = Math.floor((d + 3) / 7); botLabel = p2; }
    else if (ppd < 100) { topKey = Math.floor((d + 3) / 7); topLabel = `Week of ${p2} ${MON[m - 1]} ${y}`; botKey = d; botLabel = ppd < 50 ? "SMTWTFS"[wd] : p2; }
    else { topKey = d; topLabel = `${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][wd]} ${p2} ${MON[m - 1]}`; botKey = null; }
    if (topKey !== prevTop) { tops.push([x, topLabel]); prevTop = topKey; }
    if (botKey !== null && botKey !== prevBot) { bots.push([x, botLabel]); prevBot = botKey; }
    if (botKey === null) for (const h of [0, 6, 12, 18]) bots.push([X(d * 1440 + h * 60), String(h).padStart(2, "0")]);
  }
  const tier = (list, y0) => list.forEach(([x, label], i) => {
    const next = i + 1 < list.length ? list[i + 1][0] : W;
    s.append(svg("path", { d: `M${x} ${y0}v${HEAD_TIER}`, class: "g-tick" }));
    if (next - x >= label.length * 7.4 + 6) s.append(svg("text", { x: x + 4, y: y0 + 15, class: "g-label" }, label));
  });
  tier(tops, 0);
  tier(bots, HEAD_TIER);
  s.append(svg("path", { d: `M0 ${HEAD_TIER}H${W}M0 ${2 * HEAD_TIER}H${W}`, class: "g-tick" }));
  const flagRect = (t, label) => { const x = X(t), w = label.length * 6.9 + 26; return { x, w, bx: x + w <= W - 2 ? x : x - w }; };
  const flag = (kind, f, label) => {
    const bx = f.bx, w = f.w, y = 2 * HEAD_TIER;
    const g = svg("g", { class: kind === "dd" ? "g-flag-dd" : "g-flag-fin" });
    g.append(svg("rect", { x: bx, y: y + 1, width: w, height: HEAD_FLAG - 2, rx: 3 }));
    if (kind === "fin") g.append(svg("path", { d: `M${bx + 10} ${y + 4}l5 5-5 5-5-5z`, class: "g-flag-ico" }));
    else g.append(svg("path", { d: `M${bx + 10} ${y + 4}v11`, class: "g-flag-ico", "stroke-dasharray": "2 1.5" }));
    g.append(svg("text", { x: bx + 20, y: y + 13, class: "g-flag-tx" }, label));
    s.append(g);
  };
  const ddLab = "DATA DATE " + fmtDate(APP.p.data_date, showTime());
  const dd = flagRect(C.parse_dt(APP.p.data_date), ddLab);
  if (APP.s) {
    const finLab = "FINISH " + fmtDate(APP.s.finish, showTime());
    const fin = flagRect(C.parse_dt(APP.s.finish), finLab);
    // when the two flags would overlap, the data date flag hangs to the left of its line
    if (dd.bx < fin.bx + fin.w && fin.bx < dd.bx + dd.w) dd.bx = Math.max(0, Math.min(dd.x - dd.w, fin.bx - dd.w - 2));
    flag("dd", dd, ddLab);
    flag("fin", fin, finLab);
  } else flag("dd", dd, ddLab);
  syncScaleScroll();
}
function syncScaleScroll() { $("gscale").style.transform = `translateX(${-$("gscroll").scrollLeft}px)`; }

// ---- Gantt body: rows, links, bars, data date, finish line (in that order)
function drawGantt(a0, a1) {
  const g = clear($("gsvg"));
  const W = tlWidth(), H = APP.rows.length * RH;
  g.setAttribute("width", W);
  g.setAttribute("height", Math.max(H, 1));
  const defs = svg("defs");
  const pat = svg("pattern", { id: "g-near", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
  pat.append(svg("rect", { width: 6, height: 6, class: "pf-near" }), svg("path", { d: "M0 0v6", class: "ps-near" }));
  defs.append(pat);
  g.append(defs);
  const gs = $("gscroll");
  const vx0 = Math.max(0, gs.scrollLeft - 400), vx1 = gs.scrollLeft + (gs.clientWidth || 1200) + 400;
  const y0 = a0 * RH, y1 = a1 * RH;
  const gBack = svg("g"), gRows = svg("g"), gLinks = svg("g", { class: "g-links" }), gBars = svg("g");
  g.append(gBack, gRows, gLinks, gBars);
  // non-working time of the project calendar, from the Weeks zoom up; a 24 hour calendar has none
  if (TL.ppd >= 12) {
    const cal = APP.pcalC;
    const dStart = Math.floor(vx0 / TL.ppd + TL.t0 / 1440), dEnd = Math.ceil(vx1 / TL.ppd + TL.t0 / 1440);
    for (let d = dStart; d <= dEnd; d++) if (cal.day_work(d) === 0) gBack.append(svg("rect", { x: X(d * 1440), y: y0, width: TL.ppd, height: y1 - y0, class: "g-nonwork" }));
  }
  // gridlines on the top tier boundaries
  {
    const dStart = Math.floor(vx0 / TL.ppd + TL.t0 / 1440), dEnd = Math.ceil(vx1 / TL.ppd + TL.t0 / 1440);
    let prev = null;
    for (let d = dStart; d <= dEnd; d++) {
      const [yy, mm] = C.civil_from_days(d);
      const k = TL.ppd < 30 ? yy * 12 + mm : TL.ppd < 100 ? Math.floor((d + 3) / 7) : d;
      if (prev !== null && k !== prev) gBack.append(svg("path", { d: `M${X(d * 1440)} ${y0}V${y1}`, class: "g-grid" }));
      prev = k;
    }
  }
  const b = APP.baseline ? APP.p.baselines.find((x) => x.id === APP.p.baseline) : null;
  const bh = Math.max(8, Math.round(RH * 0.4)), blH = RH < 40 ? 3 : 4;
  const pos = new Map();
  for (let i = a0; i < a1; i++) {
    const row = APP.rows[i], y = i * RH;
    if (row.kind === "w") {
      gRows.append(svg("rect", { x: 0, y, width: W, height: RH, class: "g-band l" + Math.min(3, row.depth + 1) }));
      const r = APP.roll[row.id];
      if (r && r.es) {
        const x1 = XS(r.es), x2 = Math.max(XS(r.ef), x1 + 10), cy = y + RH / 2 - 3;
        gBars.append(svg("path", { d: `M${x1} ${cy - 2}H${x2}v10l-5-5H${x1 + 5}l-5 5z`, class: "g-sum" }));
      }
      continue;
    }
    const a = row.a, r = rec(a);
    if (APP.sel === a.id) gRows.append(svg("rect", { x: 0, y, width: W, height: RH, class: "g-row sel" }));
    gRows.append(svg("rect", { x: 0, y, width: W, height: RH, class: "g-row", "data-id": a.id, style: "fill:transparent" }));
    if (!r) continue;
    const st = penState(r);
    const hasBl = !!(b && b.acts[a.id] && a.type === "task");
    const by = y + (RH - bh) / 2 - (hasBl ? blH / 2 + 1 : 0);
    const cy = by + bh / 2;
    if (hasBl) {
      const bx1 = XS(b.acts[a.id][0]), bx2 = XS(b.acts[a.id][1]);
      gBars.append(svg("rect", { x: bx1, y: by + bh + 2, width: Math.max(2, bx2 - bx1), height: blH, class: "g-bl" }));
    }
    const es = XS(r.es), ef = XS(r.ef);
    const cls = { done: "g-bar done", crit: "g-bar crit", near: "g-bar near", norm: "g-bar" }[st];
    const nearFill = st === "near" ? "fill:url(#g-near)" : null;
    let x0 = es, x1 = ef;
    if (a.type !== "task" || (a.od === 0 && r.status !== "active")) {
      const s = bh / 2 + 2;
      gBars.append(svg("path", { d: `M${es} ${cy - s}l${s} ${s}-${s} ${s}-${s}-${s}z`, class: { done: "g-ms done", crit: "g-ms crit", near: "g-ms near", norm: "g-ms" }[st], style: nearFill }));
      x0 = es - s; x1 = es + s;
    } else if (r.status === "active") {
      // actual work in ink up to the data date, a 1 px paper gap, then the remaining state
      const xa = XS(a.as), xd = Math.min(X(C.parse_dt(APP.p.data_date)), ef);
      gBars.append(svg("rect", { x: xa, y: by, width: Math.max(1, xd - xa - 1), height: bh, class: "g-act" }));
      const xr = XS(r.res);
      gBars.append(svg("rect", { x: xr, y: by, width: Math.max(1, ef - xr), height: bh, class: cls, style: nearFill }));
      x0 = xa;
    } else {
      gBars.append(svg("rect", { x: es, y: by, width: Math.max(1, ef - es), height: bh, class: cls, style: nearFill }));
    }
    let tail = x1;
    if (APP.float && r.lf && r.tf > 0 && r.status !== "complete") {
      const xl = XS(r.lf);
      if (xl > ef + 1) { gBars.append(svg("path", { d: `M${ef} ${cy}H${xl}M${xl} ${cy - bh / 2 + 1}v${bh - 2}`, class: "g-float" })); tail = Math.max(tail, xl); }
    }
    if (TL.ppd >= 4) gBars.append(svg("text", { x: tail + 6, y: cy + 4.5, class: "g-text" }, a.name.length > 60 ? a.name.slice(0, 57) + "..." : a.name));
    pos.set(a.id, { y: cy, s: x0, f: x1 });
  }
  if (APP.links && APP.s) {
    for (const r of APP.p.rels) {
      const p = pos.get(r.pred), q = pos.get(r.succ);
      if (!p || !q) continue;
      const t = r.type;
      const xa = t === "FS" || t === "FF" ? p.f : p.s;
      const toFin = t === "FF" || t === "SF";
      const xb = toFin ? q.f : q.s;
      const drv = APP.s.rels[r.id] && APP.s.rels[r.id].driving && APP.s.acts[r.succ].crit;
      const dr = toFin ? -1 : 1;
      let d;
      if (!toFin && xb - 8 >= xa + 4) d = `M${xa} ${p.y}H${xb - 8 > xa + 6 ? xa + 6 : xb - 8}V${q.y}H${xb - 1}`;
      else {
        const mid = q.y > p.y ? q.y - RH / 2 : q.y + RH / 2;
        const out = t === "FS" || t === "FF" ? xa + 6 : xa - 6;
        const into = toFin ? xb + 8 : xb - 8;
        d = `M${xa} ${p.y}H${out}V${mid}H${into}V${q.y}H${xb - dr}`;
      }
      const c = drv ? " drv" : "";
      gLinks.append(svg("path", { d, class: "g-link" + c }));
      gLinks.append(svg("path", { d: `M${xb} ${q.y}l${-5 * dr} -3v6z`, class: "g-arrow" + c }));
    }
  }
  const xdd = XS(APP.p.data_date);
  g.append(svg("path", { d: `M${xdd} ${y0}V${Math.max(y1, 1)}`, class: "g-dd" }));
  if (APP.s) { const xf = XS(APP.s.finish); g.append(svg("path", { d: `M${xf} ${y0}V${Math.max(y1, 1)}`, class: "g-fin" })); }
}

// ---- selection, scrolling, editing
function selectAct(id, scroll) {
  APP.sel = id;
  if (scroll && APP.rowIndex.has(id)) {
    const i = APP.rowIndex.get(id), sc = $("tscroll");
    if (i * RH < sc.scrollTop || (i + 1) * RH > sc.scrollTop + sc.clientHeight) sc.scrollTop = Math.max(0, i * RH - sc.clientHeight / 3);
    const r = rec(APP.byId.get(id));
    if (r && scroll === "gantt") { const gs = $("gscroll"); const x = XS(r.es); if (x < gs.scrollLeft || x > gs.scrollLeft + gs.clientWidth - 80) gs.scrollLeft = Math.max(0, x - 120); }
  }
  // update the highlight in place so a double click lands on the same row element
  for (const line of $("trows").querySelectorAll(".tr[data-id]")) {
    const on = line.dataset.id === id;
    line.classList.toggle("sel", on);
    line.setAttribute("aria-selected", on ? "true" : "false");
  }
  if (scroll) drawSheetRows(); else { const [a0, a1] = visRange(); drawGantt(a0, a1); }
  renderDetails();
}
let editing = null;
function startEdit(i, ci, initial) {
  const row = APP.rows[i];
  if (!row || row.kind !== "a") return;
  const c = cols()[ci];
  if (!c || !c.edit) return;
  const line = $("trows").querySelector(`.tr[data-i="${i}"]`);
  if (!line) return;
  const cell = line.querySelector(`.tc[data-c="${ci}"]`);
  const a = row.a;
  const val = c.edit === "start" ? (a.as || (a.cstr === "SNET" ? a.cstr_date : rec(a) && rec(a).es)) : c.edit === "finish" ? (a.af || (rec(a) && rec(a).ef)) : null;
  const inp = el("input", { type: "text", cls: "cell", "aria-label": c.h + " for " + a.code, value: initial !== undefined ? initial : val ? val.replace("T", " ") : c.get(a, rec(a)) });
  clear(cell).append(inp);
  editing = { i, ci, id: a.id, key: c.edit };
  inp.focus();
  if (initial === undefined) inp.select();
  let done = false;
  const finish = (save, move) => {
    if (done) return;
    done = true;
    const text = inp.value;
    editing = null;
    if (save) applyCellEdit(a.id, c.edit, text);
    else drawSheetRows();
    if (move) moveCell(move[0], move[1]);
    $("tscroll").focus({ preventScroll: true });
  };
  inp.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); finish(true, [1, 0]); }
    else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
    else if (ev.key === "Tab") { ev.preventDefault(); finish(true, [0, ev.shiftKey ? -1 : 1]); }
    ev.stopPropagation();
  });
  // a blur that comes from the rows being redrawn finishes after the redraw, not inside it
  inp.addEventListener("blur", () => { if (drawing) setTimeout(() => finish(true), 0); else finish(true); });
}
let cursor = { i: 0, ci: 0 };
function moveCell(di, dci) {
  const n = APP.rows.length;
  if (!n) return;
  cursor.i = Math.max(0, Math.min(n - 1, cursor.i + di));
  cursor.ci = Math.max(0, Math.min(cols().length - 1, cursor.ci + dci));
  const row = APP.rows[cursor.i];
  if (row.kind === "a") selectAct(row.id, true);
  else { const sc = $("tscroll"); if (cursor.i * RH < sc.scrollTop || (cursor.i + 1) * RH > sc.scrollTop + sc.clientHeight) sc.scrollTop = cursor.i * RH - sc.clientHeight / 3; }
}

// one cell edit becomes one undoable change
function applyCellEdit(id, key, text) {
  const a = APP.byId.get(id), r = rec(a);
  const t = text.trim();
  try {
    if (key === "code") {
      if (!t) throw new C.SchedError("bad_field", "Activity ID cannot be blank.");
      if (t !== a.code && APP.codeToId.has(t)) throw new C.SchedError("duplicate_id", `Activity ID ${t} is already used.`);
      mutate(`Rename ${a.code} to ${t}`, (q) => { q.activities.find((x) => x.id === id).code = t; });
    } else if (key === "name") mutate(`Edit name of ${a.code}`, (q) => { q.activities.find((x) => x.id === id).name = t; });
    else if (key === "od") {
      const m = parseDur(t, a);
      if (m < 0) throw new C.SchedError("bad_field", "A duration cannot be negative.");
      mutate(`Set duration of ${a.code}`, (q) => {
        const x = q.activities.find((y) => y.id === id);
        if (x.type !== "task") { if (m > 0) { x.type = "task"; } }
        x.od = m;
        if (!x.as) x.rd = m;
      });
    } else if (key === "rd") {
      const m = parseDur(t, a);
      mutate(`Set remaining duration of ${a.code}`, (q) => { const x = q.activities.find((y) => y.id === id); if (!x.af) x.rd = Math.max(0, m); });
    } else if (key === "pct") setPercent(a, parseFloat(t.replace("%", "")));
    else if (key === "start") {
      const d = parseDateInput(t, false);
      if (a.as) mutate(`Set actual start of ${a.code}`, (q) => { q.activities.find((x) => x.id === id).as = d; });
      else if (!d) mutate(`Clear start constraint on ${a.code}`, (q) => { const x = q.activities.find((y) => y.id === id); if (x.cstr === "SNET") { x.cstr = "ASAP"; x.cstr_date = null; } });
      else { mutate(`Start ${a.code} on or after ${fmtDate(d)}`, (q) => { const x = q.activities.find((y) => y.id === id); x.cstr = "SNET"; x.cstr_date = d; }); toast(`Set a start on or after constraint on ${a.code}. Undo to remove it.`); }
    } else if (key === "finish") {
      const d = parseDateInput(t, true);
      if (a.af) mutate(`Set actual finish of ${a.code}`, (q) => { q.activities.find((x) => x.id === id).af = d; });
      else if (d) { mutate(`Finish ${a.code} on or after ${fmtDate(d)}`, (q) => { const x = q.activities.find((y) => y.id === id); x.cstr = "FNET"; x.cstr_date = d; }); toast(`Set a finish on or after constraint on ${a.code}. Undo to remove it.`); }
    } else if (key === "as") {
      const d = parseDateInput(t, false);
      mutate(d ? `Set actual start of ${a.code}` : `Clear actual start of ${a.code}`, (q) => { const x = q.activities.find((y) => y.id === id); x.as = d; if (!d) { x.af = null; x.rd = x.od; } });
    } else if (key === "af") {
      const d = parseDateInput(t, true);
      mutate(d ? `Set actual finish of ${a.code}` : `Clear actual finish of ${a.code}`, (q) => {
        const x = q.activities.find((y) => y.id === id);
        if (d && !x.as) x.as = r ? (r.es < d ? r.es : d) : d;
        x.af = d;
        if (d) x.rd = 0; else if (!x.rd) x.rd = x.od;
      });
    } else if (key === "preds") setPredsFromText(a, t);
  } catch (e) {
    if (e instanceof C.SchedError) { toast(e.message, "bad"); drawSheetRows(); } else throw e;
  }
}
// percent complete the way desktop schedulers take it: actual start from the plan when missing,
// remaining duration from the percent (duration type), or the physical percent as typed
function setPercent(a, v) {
  if (!(v >= 0 && v <= 100)) { toast("Percent complete is 0 to 100.", "bad"); drawSheetRows(); return; }
  const r = rec(a), dd = APP.p.data_date;
  mutate(`Set ${a.code} to ${v}% complete`, (q) => {
    const x = q.activities.find((y) => y.id === a.id);
    if (v > 0 && !x.as) x.as = r && r.es < dd ? r.es : dd;
    if (x.pct_type === "physical") x.phys = v;
    if (v >= 100) { x.af = r && r.ef < dd && r.ef >= x.as ? r.ef : dd < x.as ? x.as : dd; x.rd = 0; }
    else {
      x.af = null;
      if (x.pct_type !== "physical") x.rd = Math.round(x.od * (100 - v) / 100);
      if (v === 0 && x.pct_type !== "physical") { x.as = null; x.rd = x.od; }

  });
}
// "A1000, A1010SS+2d, A1020 FF-4h" replaces the activity's predecessors
function setPredsFromText(a, text) {
  const items = text.split(/[,;]+/).map((s) => s.trim()).filter(Boolean);
  const rels = [];
  for (const it of items) {
    const m = /^(.+?)\s*(FS|SS|FF|SF)?\s*([+-]\s*\d+(?:\.\d+)?\s*[a-z]*)?$/i.exec(it);
    let code = m ? m[1].trim() : it, type = m && m[2] ? m[2].toUpperCase() : "FS", lag = 0;
    if (!APP.codeToId.has(code) && m && !m[2]) {

      if (m2 && APP.codeToId.has(m2[1])) { code = m2[1]; type = m2[2].toUpperCase(); }
    }
    if (!APP.codeToId.has(code)) throw new C.SchedError("bad_ref", `There is no activity ${code}.`);
    if (m && m[3]) lag = parseDur(m[3].replace(/\s+/g, "").replace(/^\+/, ""), a);
    rels.push({ pred: APP.codeToId.get(code), type, lag });
  }
  mutate(`Set predecessors of ${a.code}`, (q) => {
    const keep = q.rels.filter((r) => r.succ !== a.id);
    for (const r of rels) {
      const old = q.rels.find((x) => x.succ === a.id && x.pred === r.pred && x.type === r.type);
      keep.push(old ? Object.assign(old, { lag: r.lag }) : { id: nextId(q.rels.concat(keep), "r"), pred: r.pred, succ: a.id, type: r.type, lag: r.lag });
    }
    q.rels = keep;
  });
}

function addActivity() {
  const after = APP.sel ? APP.byId.get(APP.sel) : null;
  const code = nextCode();
  let newId;
  const linked = after && !after.af;
  const ok = mutate(`Add ${code}`, (q) => {
    newId = nextId(q.activities, "a");
    const a = { id: newId, code, name: "New activity", wbs: after ? after.wbs : (q.wbs[0] ? q.wbs[0].id : null), od: hpdOf(after), rd: hpdOf(after), unit: after ? after.unit : q.settings.unit };
    if (after && after.cal) a.cal = after.cal;
    const i = after ? q.activities.findIndex((x) => x.id === after.id) : q.activities.length - 1;
    q.activities.splice(i + 1, 0, a);
    if (after && !after.af) q.rels.push({ id: nextId(q.rels, "r"), pred: after.id, succ: newId, type: "FS", lag: 0 });
  }, linked ? { actor: "auto", why: `${code} went in after ${after.code}, the selected activity, with a finish-to-start link so it is not an open end.` } : { why: `${code} was added at the end of the list.` });
  if (!ok) return;
  toast(linked ? `Added ${code} after ${after.code} with a finish-to-start link.` : `Added ${code}.`, null, true);
  APP.sel = newId;
  selectAct(newId, true);
  const i = APP.rowIndex.get(newId);
  const ci = cols().findIndex((c) => c.key === "name");
  if (i !== undefined && ci >= 0) { cursor = { i, ci }; setTimeout(() => startEdit(i, ci), 30); }
}
function deleteActivity() {
  if (!APP.sel) { toast("Select an activity first."); return; }
  const a = APP.byId.get(APP.sel);
  let bridged = 0;
  const ok = mutate(`Delete ${a.code}`, (q) => {
    const preds = q.rels.filter((r) => r.succ === a.id && (r.type === "FS" || r.type === "SS"));
    const succs = q.rels.filter((r) => r.pred === a.id && (r.type === "FS" || r.type === "SS"));
    q.rels = q.rels.filter((r) => r.pred !== a.id && r.succ !== a.id);
    for (const p of preds) for (const s of succs) {
      if (!q.rels.some((r) => r.pred === p.pred && r.succ === s.succ)) { q.rels.push({ id: nextId(q.rels, "r"), pred: p.pred, succ: s.succ, type: "FS", lag: 0 }); bridged++; }
    }
    q.activities = q.activities.filter((x) => x.id !== a.id);
    q.assigns = q.assigns.filter((x) => x.act !== a.id);
  }, { actor: "auto", why: () => (bridged ? `${a.code} was deleted; its predecessors were linked to its successors (${plural(bridged, "new link")}) so the logic stays closed.` : `${a.code} was deleted.`) });
  if (ok) toast(bridged ? `Deleted ${a.code} and linked its predecessors to its successors (${plural(bridged, "new link")}) so the logic stays closed.` : `Deleted ${a.code}.`, null, true);
}

function applyFixes(list) {

const MAX_FILE = 64 * 1024 * 1024;

// ---- open any supported file (format detected from its content)
async function importFile(file, chosenId) {
  if (file.size > MAX_FILE) { toast("That file is larger than 64 MB, the limit for this tool.", "bad"); return; }
  let bytes;
  try { bytes = new Uint8Array(await file.arrayBuffer()); } catch (e) { toast("Could not read that file.", "bad"); return; }
  let out;
  try {
    out = chosenId ? C.open_file(bytes, chosenId) : C.open_file(bytes);
    // a file from P6 marks the project it was exported for; open that one and say so, and ask only
    // when the file does not say which
    if (!chosenId && out.kind === "xer" && out.projects.length > 1 && out.projects.filter((x) => x.exported).length !== 1) {
      const chosen = await pickXerProject(out.projects, out.project);
      if (chosen === null) return;
      out = C.open_file(bytes, chosen);
    }
  } catch (e) {
    if (e instanceof C.SchedError) { toast(e.message, "bad"); return; }
    throw e;
  }
  const p = out.project;
  let sched = null, fid = null, loop = null;
  try { sched = C.schedule(p); fid = Object.keys(out.stored).length ? C.compare_stored(p, sched, out.stored, out.kind) : null; } catch (e) { if (e instanceof C.SchedError) loop = e; else throw e; }

// XER files are Windows-1252, the code page P6 writes; characters outside it are written as "?" and
// the person is told how many
async function exportXer() {
  const text = C.write_xer(APP.p, APP.s, APP.p.data_date);
  const bytes = C.encode_cp1252(text);
  let lost = 0;
  for (const b of bytes) if (b === 0x3F) lost++;
  for (const ch of text) if (ch === "?") lost--;
  await saveFile(safeName(APP.p.name) + ".xer", bytes, "application/octet-stream", ".xer", "XER file");
  if (lost > 0) toast(`${plural(lost, "character")} outside the Windows-1252 code page ${lost === 1 ? "was" : "were"} written as "?" (XER files use that code page).`, "bad");
}

function ivText(ivs) { return ivs.map(([s, f]) => C.fmt_hm(s) + "-" + C.fmt_hm(f)).join(", "); }
function parseIvs(text) {
  const t = text.trim().toLowerCase();
  if (!t || t === "off" || t === "none" || t === "holiday") return [];
  return t.split(/[,;]+/).map((part) => {
    const m = /^\s*(\d{1,2}):?(\d{2})?\s*-\s*(\d{1,2}):?(\d{2})?\s*$/.exec(part);
    if (!m) throw new C.SchedError("bad_calendar", `"${part.trim()}" is not a work period. Use 08:00-12:00, 13:00-17:00.`);
    return [+m[1] * 60 + +(m[2] || 0), +m[3] * 60 + +(m[4] || 0)];
  });
}

    if (line && cell && line.dataset.id) { cursor = { i: +line.dataset.i, ci: +cell.dataset.c }; startEdit(cursor.i, cursor.ci); }
  });
  $("gsvg").addEventListener("click", (ev) => { const id = ev.target.dataset && ev.target.dataset.id; const hit = ev.target.closest("[data-id]"); const aid = id || (hit && hit.dataset.id); if (aid) { cursor.i = APP.rowIndex.get(aid) || 0; selectAct(aid, false); } });
  $("netsvg").addEventListener("click", (ev) => { const g = ev.target.closest("[data-id]"); if (g) { APP.sel = g.dataset.id; renderNetwork(); } });
  $("netsvg").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { const g = ev.target.closest("[data-id]"); if (g) { showView("acts"); selectAct(g.dataset.id, "gantt"); } } });
  $("tscroll").addEventListener("keydown", (ev) => {
    if (editing) return;
    const k = ev.key;
    if (k === "ArrowDown") { ev.preventDefault(); moveCell(1, 0); }
    else if (k === "ArrowUp") { ev.preventDefault(); moveCell(-1, 0); }
    else if (k === "ArrowRight" || (k === "Tab" && !ev.shiftKey)) { ev.preventDefault(); moveCell(0, 1); }
    else if (k === "ArrowLeft" || (k === "Tab" && ev.shiftKey)) { ev.preventDefault(); moveCell(0, -1); }
    else if (k === "PageDown") { ev.preventDefault(); moveCell(Math.floor($("tscroll").clientHeight / RH), 0); }
    else if (k === "PageUp") { ev.preventDefault(); moveCell(-Math.floor($("tscroll").clientHeight / RH), 0); }
    else if (k === "Enter" || k === "F2") { ev.preventDefault(); startEdit(cursor.i, cursor.ci); }
    else if (k === "Delete") { ev.preventDefault(); deleteActivity(); }
    else if (k.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey) { const c = cols()[cursor.ci]; if (c && c.edit) { ev.preventDefault(); startEdit(cursor.i, cursor.ci, k); } }
  });
  // splitter
  const sp = $("split");
  sp.addEventListener("pointerdown", (ev) => {
    sp.setPointerCapture(ev.pointerId);
    const x0 = ev.clientX, w0 = APP.tw;
    const move = (e) => { APP.tw = Math.max(160, Math.min(window.innerWidth - 200, w0 + e.clientX - x0)); $("tpane").style.setProperty("--tw", APP.tw + "px"); };
    const up = () => { sp.removeEventListener("pointermove", move); sp.removeEventListener("pointerup", up); kvSet("tw", APP.tw); queueSheet(); };
    sp.addEventListener("pointermove", move); sp.addEventListener("pointerup", up);
  });
  sp.addEventListener("keydown", (ev) => { if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") { APP.tw = Math.max(160, APP.tw + (ev.key === "ArrowLeft" ? -24 : 24)); $("tpane").style.setProperty("--tw", APP.tw + "px"); kvSet("tw", APP.tw); } });
  // global keys, the way desktop schedulers use them
  document.addEventListener("keydown", (ev) => {
    const typing = ev.target.matches && ev.target.matches("input, textarea, select") && ev.target.id !== "tscroll";
    if ($("dlg").open) return;
    const ctrl = ev.ctrlKey || ev.metaKey;
    if (ev.key === "F9") { ev.preventDefault(); scheduleNow(); }
    else if (ctrl && (ev.key === "z" || ev.key === "Z") && !ev.shiftKey && !typing) { ev.preventDefault(); undo(); }
    else if (ctrl && (ev.key === "y" || ((ev.key === "z" || ev.key === "Z") && ev.shiftKey)) && !typing) { ev.preventDefault(); redo(); }
    else if (ctrl && (ev.key === "=" || ev.key === "+")) { ev.preventDefault(); zoom(1); }
    else if (ctrl && ev.key === "-") { ev.preventDefault(); zoom(-1); }
    else if (ctrl && (ev.key === "o" || ev.key === "O")) { ev.preventDefault(); projectsDialog(); }
    else if (ctrl && (ev.key === "f" || ev.key === "F") && APP.view === "acts") { ev.preventDefault(); findActivity(); }
    else if (ctrl && (ev.key === "p" || ev.key === "P")) { ev.preventDefault(); if (APP.s) pdfDialog(); }
    else if (ev.key === "Insert" && !typing) { ev.preventDefault(); addActivity(); }
    else if (ev.key === "Escape") closeMenu();
  });
  let lastRH = RH;
  window.addEventListener("resize", () => { if (readRH() !== lastRH) { lastRH = RH; renderSheet(); } else queueSheet(); });
  window.addEventListener("beforeunload", () => { if (APP.dirty) saveNow(); });
}

// ---- ui/80_net.js
// ---------------------------------------------------------------- network: one gate, nothing behind it
// Every request this page could make would have to pass through net(). There are no network features
// today, so the list is empty and the gate refuses everything; the headless test confirms the page
// makes zero requests. A future feature would add an entry here, off by default, with its one host.
const NET_FEATURES = {};
function netDecision(feature, url) {
  const f = NET_FEATURES[feature];
  if (!f) return { ok: false, reason: "no such network feature" };
  if (!(APP.kvNet && APP.kvNet[feature] === true)) return { ok: false, reason: f.title + " is off" };
  let u;
  try { u = new URL(url); } catch (e) { return { ok: false, reason: "not a web address" }; }
  if (u.protocol !== "https:" || !f.hosts.includes(u.hostname)) return { ok: false, reason: u.hostname + " is not allowed" };
  return { ok: true };
}
async function net(feature, url, opts) {
  const d = netDecision(feature, url);
  if (!d.ok) throw new Error("Blocked: " + d.reason + ".");
  return fetch(url, Object.assign({ credentials: "omit", referrerPolicy: "no-referrer" }, opts || {}));
}

async function main() {
  // the Pages build marks the page when another site frames it; the app is then not mounted at all
  if (document.documentElement.hasAttribute("data-framed")) return;
  renderMethod();
  wireShell();
  try { APP.db = await idbOpen(); } catch (e) { APP.db = null; }
  const theme = await kvGet("theme", "");
  if (theme) document.documentElement.dataset.theme = theme;
  themeIcon();
  APP.density = await kvGet("density", "comfortable");
  if (!DENSITY.some(([k]) => k === APP.density)) APP.density = "comfortable";
  $("app").dataset.density = APP.density;
  APP.colw = await kvGet("colw", {}) || {};
  APP.layout = await kvGet("layout", "classic");
  if (!LAYOUTS[APP.layout]) APP.layout = "classic";
  APP.zoom = Math.max(0, Math.min(ZOOMS.length - 1, await kvGet("zoom", 2)));
  APP.tw = await kvGet("tw", 742);
  APP.links = await kvGet("links", true);
  APP.float = await kvGet("float", true);
  APP.baseline = await kvGet("baseline", true);
  APP.details = await kvGet("details", true);
  APP.projects = await kvGet("projects", []);
  const cur = await kvGet("current", "");
  let p = null;
  if (cur) { try { const raw = await dbGet("projects", cur); if (raw) { p = C.validate_project(raw); APP.key = cur; } } catch (e) { p = null; } }
  if (!p) {
    p = exampleProject("drill");
    APP.key = newKey();
  }
  APP.p = p;
  recalc();
  const first = APP.rows.find((r) => r.kind === "a" && APP.s && APP.s.acts[r.id].status !== "complete");

  const v = await kvGet("view", "acts");
  showView(["acts", "net", "res", "check"].includes(v) ? v : "acts");
  if (APP.sel) { cursor.i = APP.rowIndex.get(APP.sel) || 0; selectAct(APP.sel, "gantt"); }

  document.body.dataset.ready = "1";
}
