[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldsched"
version = "0.1.0"
description = "Local-first CPM scheduling: calendars, critical path, float, progress, resources, XER and Project XML files."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Will Whitmire" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Scheduling",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fieldsched = "fieldsched.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
